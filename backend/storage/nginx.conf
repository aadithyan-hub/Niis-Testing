# Local stand-in for the storage part of /etc/nginx/sites-enabled/niis on
# niis.falconavl.com. /niis-media/ and /niis-documents/ are copied from the
# live file. /niis-library/ is the block production still needs for the media
# library (gap #26) - it is tested here first.
server {
    listen 80;
    server_name _;
    client_max_body_size 32M;

    location /niis-documents/ {
        proxy_pass http://minio:9000/niis-documents/;
        proxy_set_header Host localhost:9000;
        proxy_hide_header X-Amz-Request-Id;

        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location /niis-media/ {
        proxy_pass http://minio:9000/niis-media/;
        proxy_set_header Host localhost:9000;
        proxy_hide_header X-Amz-Request-Id;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---- NEW for production: media library (private bucket) ----
    location /niis-library/ {
        # No URI after the address: the request goes to MinIO byte-for-byte,
        # so the signed path and query are not re-encoded.
        proxy_pass http://minio:9000;
        # The browser's own Host: the presigned signature covers it.
        proxy_set_header Host $http_host;
        proxy_hide_header X-Amz-Request-Id;
        # Stream videos instead of buffering them on disk.
        proxy_buffering off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
        return 404;
    }
}
