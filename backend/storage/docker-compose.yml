# Local object storage for the media library tester.
#   MinIO API      http://127.0.0.1:9100   (what the backend talks to)
#   MinIO console  http://127.0.0.1:9101   (login: niislocal / niislocal-secret)
#   nginx          http://127.0.0.1:8090   (what browsers use, like niis.falconavl.com)
name: niis-test-storage
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: niislocal
      MINIO_ROOT_PASSWORD: niislocal-secret
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data
  nginx:
    image: nginx:alpine
    depends_on: [minio]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  minio-data:
